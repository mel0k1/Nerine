name: kernel

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_UNSTABLE_JSON_TARGET_SPEC: "true"
      CARGO_UNSTABLE_BUILD_STD: core,compiler_builtins
      CARGO_UNSTABLE_BUILD_STD_FEATURES: compiler-builtins-mem
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Build
        run: cargo build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Test nectar
        run: cargo test -p nectar --target x86_64-unknown-linux-gnu
