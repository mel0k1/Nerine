name: kernel

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_UNSTABLE_JSON_TARGET_SPEC: "true"
      CARGO_UNSTABLE_BUILD_STD: core,compiler_builtins
      CARGO_UNSTABLE_BUILD_STD_FEATURES: compiler-builtins-mem
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Build
        run: cargo build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Test nectar
        run: cargo test -p nectar --target x86_64-unknown-linux-gnu
      - name: Test pollen
        run: cargo test -p pollen --target x86_64-unknown-linux-gnu
      - name: Test soil
        run: cargo test -p soil --target x86_64-unknown-linux-gnu
      - name: Test greenhouse
        run: cargo test -p greenhouse --target x86_64-unknown-linux-gnu
      - name: Test tunic
        run: cargo test -p tunic --target x86_64-unknown-linux-gnu
      - name: Test meristem
        run: cargo test -p meristem --target x86_64-unknown-linux-gnu

  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso qemu-system-x86
      - name: Smoke
        run: ./perennial.sh smoke
      - name: Shell session
        run: ./perennial.sh shell
