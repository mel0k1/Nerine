name: kernel

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_UNSTABLE_JSON_TARGET_SPEC: "true"
      CARGO_UNSTABLE_BUILD_STD: core,compiler_builtins
      CARGO_UNSTABLE_BUILD_STD_FEATURES: compiler-builtins-mem
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Build
        run: cargo build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Test nectar
        run: cargo test -p nectar --target x86_64-unknown-linux-gnu

  boot:
    runs-on: ubuntu-latest
    env:
      CARGO_UNSTABLE_JSON_TARGET_SPEC: "true"
      CARGO_UNSTABLE_BUILD_STD: core,compiler_builtins
      CARGO_UNSTABLE_BUILD_STD_FEATURES: compiler-builtins-mem
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Build
        run: cargo build
      - name: Symbols
        run: |
          nm target/x86_64-nerine/debug/bulb | grep -E " [tT] " | sort > symbols.txt
          wc -l symbols.txt
          cat symbols.txt
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso qemu-system-x86
          curl -sL -o limine.tar.gz https://github.com/Limine-Bootloader/Limine/releases/download/v12.9.4/limine-binary.tar.gz
          mkdir limine
          tar xzf limine.tar.gz -C limine
          cc -O2 -std=c99 -D_FILE_OFFSET_BITS=64 limine/limine-binary/limine.c -o limine/limine
      - name: ISO
        run: |
          mkdir -p isoroot/boot
          cp target/x86_64-nerine/debug/bulb isoroot/boot/nerine.elf
          cp ci/limine.conf isoroot/limine.conf
          cp limine/limine-binary/limine-bios-cd.bin isoroot/
          cp limine/limine-binary/limine-bios.sys isoroot/
          cp limine/limine-binary/limine-uefi-cd.bin isoroot/
          xorriso -as mkisofs -o nerine.iso \
            -b limine-bios-cd.bin -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot -b limine-uefi-cd.bin -no-emul-boot \
            isoroot
      - name: Boot
        run: |
          timeout 120 qemu-system-x86_64 -M q35 -cpu max -m 512M -cdrom nerine.iso \
            -display none -serial file:serial.log -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 || true
          cat serial.log
          grep -q "Nerine / Bulb" serial.log
          grep -q "nectar:1:7" serial.log
          grep -q "guest:done" serial.log
